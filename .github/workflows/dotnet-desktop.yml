name: .NET Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore host/GrblHost.sln

      - name: Build solution
        run: dotnet build host/GrblHost.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Run core unit tests
        run: >-
          dotnet test host/GrblHost.Core.Tests/GrblHost.Core.Tests.csproj
          --configuration ${{ matrix.configuration }} --no-build --no-restore
          --logger "trx;LogFileName=core-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

      - name: Publish standalone Windows application
        run: >-
          dotnet publish host/GrblHost/GrblHost.csproj
          --configuration ${{ matrix.configuration }} --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/GrblHost

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: GrblHost-win-x64-${{ matrix.configuration }}
          path: artifacts/GrblHost/
          if-no-files-found: error
